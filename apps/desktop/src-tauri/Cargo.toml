[package]
name = "agents-multi-desktop"
# The app's version is tauri.conf.json's, which reads ../package.json (bumped by scripts/release.ts).
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "=1.0.151"

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
url = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
# the GTK window behind the webview, to hand it the launcher's activation token (src/activation.rs)
gtk = "=0.18.2"
# the tray asks D-Bus whether a StatusNotifier host is there (the single-instance plugin already uses it)
zbus = "=5.19.0"

[target.'cfg(unix)'.dependencies]
# SIGTERM to the backend, and its parent-death signal on Linux (src/backend.rs).
libc = "=0.2.190"
