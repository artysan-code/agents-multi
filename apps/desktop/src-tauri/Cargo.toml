[package]
name = "agents-multi-desktop"
# The app's version is tauri.conf.json's, which reads ../package.json (bumped by scripts/release.ts).
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
url = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# The tray asks D-Bus whether a StatusNotifier host is there (the single-instance plugin already uses it).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"
