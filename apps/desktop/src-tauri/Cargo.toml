[package]
name = "agents-multi-desktop"
# The app's version is tauri.conf.json's, which reads ../package.json (bumped by scripts/release.ts).
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }
serde_json = "=1.0.151"

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-single-instance = "=2.5.2"
# signed app updates (src/updater.rs); optional, so a build for a package manager can leave it out
tauri-plugin-updater = { version = "=2.12.0", optional = true }
url = "2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
# the GTK window behind the webview, to hand it the launcher's activation token (src/activation.rs)
gtk = "=0.18.2"
# the tray asks D-Bus whether a StatusNotifier host is there (the single-instance plugin already uses it)
zbus = "=5.19.0"
# the tray itself, a StatusNotifierItem with a left click (src/tray/sni.rs): on the zbus above and its
# async-io executor, not tokio, so the tree keeps one D-Bus stack
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Tauri's tray elsewhere; on Linux it is libayatana-appindicator, which delivers no left click
tauri = { version = "=2.12.1", features = ["tray-icon"] }

[target.'cfg(unix)'.dependencies]
# SIGTERM to the backend, and its parent-death signal on Linux (src/backend.rs).
libc = "=0.2.190"

[features]
default = ["updater"]
# the in-app updater (src/updater.rs, docs/adr/0004): left out of builds a package manager updates
updater = ["dep:tauri-plugin-updater"]
