# The brain on Coolify: the service, for every account, and the embedding model next to it on a
# private network.
# Coolify builds this from the repository (base directory /apps/brain, compose file /compose.yaml:
# the build context is the repository root) and puts the domain in front of `brain`: SERVICE_URL_BRAIN_8080
# tells its proxy the port, and SERVICE_URL_BRAIN is that domain. The secrets are set in Coolify,
# never here.
services:
  brain:
    build:
      context: ../..
      dockerfile: apps/brain/Dockerfile
    environment:
      - SERVICE_URL_BRAIN_8080
      - BRAIN_URL=${SERVICE_URL_BRAIN}
      - BRAIN_MASTER_KEY=${BRAIN_MASTER_KEY}
      - BRAIN_ADMIN_ID=${BRAIN_ADMIN_ID:-}
      # whose brain this is (shared/mcp/lib/owner.ts): the default owner of a task, the name and language
      - CLAUDE_MULTI_OWNER_ID=${CLAUDE_MULTI_OWNER_ID}
      - CLAUDE_MULTI_OWNER_NAME=${CLAUDE_MULTI_OWNER_NAME}
      - CLAUDE_MULTI_LANGUAGE=${CLAUDE_MULTI_LANGUAGE}
      # the public pages (public.ts): who runs this instance, how to reach them, where it is hosted
      - BRAIN_OPERATOR=${BRAIN_OPERATOR:-}
      - BRAIN_CONTACT=${BRAIN_CONTACT:-}
      - BRAIN_HOSTING=${BRAIN_HOSTING:-}
      # the site's own address (another origin than the brain's), when it has one
      - BRAIN_SITE_URL=${BRAIN_SITE_URL:-}
      # the header a proxy in front puts the client's address in (cf-connecting-ip behind Cloudflare),
      # for the rate limits; empty means the connection's own address
      - BRAIN_CLIENT_IP_HEADER=${BRAIN_CLIENT_IP_HEADER:-}
      - BRAIN_EMBED_URL=${BRAIN_EMBED_URL:-http://ollama:11434}
      # the embedding model: the same name is pulled by the ollama service below
      - BRAIN_EMBED_MODEL=${BRAIN_EMBED_MODEL:-bge-m3}
      # a sealed copy of every database a day in /data/backups, the last BRAIN_BACKUP_KEEP kept (default 7);
      # none without the key (32 random bytes, base64)
      - BRAIN_BACKUP_KEY=${BRAIN_BACKUP_KEY:-}
      - BRAIN_BACKUP_KEEP=${BRAIN_BACKUP_KEEP:-7}
      - BRAIN_DATA=/data
      - PORT=8080
      # the zone of the days of an account that has not chosen its own (the account page)
      - TZ=${BRAIN_TIMEZONE:-Europe/Rome}
    volumes:
      - brain-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    # the proxy sends traffic only to a healthy container: checked every two seconds while it starts,
    # so a deploy is out of service for the seconds the new one takes to boot, not for half a minute
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:8080/ready'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # SIGTERM closes the databases (main.ts); past this, Docker kills
    stop_grace_period: 15s
    restart: unless-stopped

  # the embedding model (bge-m3 by default), pulled once into its volume; bge-m3 is about 1.2 GB on
  # disk and 2 GB of memory while it works.
  ollama:
    image: ollama/ollama:0.35.0
    entrypoint: [
      "/bin/sh",
      "-c",
      "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$$BRAIN_EMBED_MODEL\"; wait",
    ]
    environment:
      - OLLAMA_KEEP_ALIVE=10m
      - BRAIN_EMBED_MODEL=${BRAIN_EMBED_MODEL:-bge-m3}
    volumes:
      - brain-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  brain-data:
  brain-models:
