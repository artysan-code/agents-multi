# The brain on Coolify: the service, for every account, and the embedding model next to it on a
# private network.
# The image is the one each release publishes (.forgejo/workflows/release.yml, brain-image): :latest
# follows the stable versions, :X.Y.Z and :X.Y stay put. Coolify reads this file from the repository
# (base directory /apps/brain, compose file /compose.yaml) and puts the domain in front of `brain`:
# SERVICE_URL_BRAIN_8080 tells its proxy the port, and SERVICE_URL_BRAIN is that domain; the release
# has it pull the new image. Anywhere else, `docker compose up` from this folder with BRAIN_URL (the
# public address) and the secrets in a .env next to it, and a proxy with TLS in front of port 8080.
# To build from the source instead: `docker build -f apps/brain/Dockerfile -t <name> .` from the
# repository's root, and BRAIN_IMAGE=<name>. The secrets are never written here.
services:
  brain:
    image: ${BRAIN_IMAGE:-ghcr.io/artysan-code/agents-multi-brain:latest}
    environment:
      - SERVICE_URL_BRAIN_8080
      - BRAIN_URL=${BRAIN_URL:-${SERVICE_URL_BRAIN:-}}
      - BRAIN_MASTER_KEY=${BRAIN_MASTER_KEY}
      - BRAIN_ADMIN_ID=${BRAIN_ADMIN_ID:-}
      # whose brain this is (shared/mcp/lib/owner.ts): the default owner of a task, the name and language
      - AGENTS_MULTI_OWNER_ID=${AGENTS_MULTI_OWNER_ID}
      - AGENTS_MULTI_OWNER_NAME=${AGENTS_MULTI_OWNER_NAME}
      - AGENTS_MULTI_LANGUAGE=${AGENTS_MULTI_LANGUAGE}
      # the public pages (public.ts): who runs this instance, how to reach them, where it is hosted
      - BRAIN_OPERATOR=${BRAIN_OPERATOR:-}
      - BRAIN_CONTACT=${BRAIN_CONTACT:-}
      - BRAIN_HOSTING=${BRAIN_HOSTING:-}
      # the site's own address (another origin than the brain's), when it has one
      - BRAIN_SITE_URL=${BRAIN_SITE_URL:-}
      # the header a proxy in front puts the client's address in, for the rate limits. Behind Coolify's
      # Traefik (one hop) x-forwarded-for: its last entry is the address Traefik saw. Behind Cloudflare
      # in front of Traefik set cf-connecting-ip. Empty (a direct connection) means the connection's own
      # address; behind a proxy that would put every client under the proxy's address, and five wrong
      # sign-ins from anyone would lock the owner out.
      - BRAIN_CLIENT_IP_HEADER=${BRAIN_CLIENT_IP_HEADER:-x-forwarded-for}
      # how much the log says: debug, info, warn or error (one JSON line per event and per request)
      - BRAIN_LOG_LEVEL=${BRAIN_LOG_LEVEL:-info}
      - BRAIN_EMBED_URL=${BRAIN_EMBED_URL:-http://ollama:11434}
      # the embedding model: the same name is pulled by the ollama service below
      - BRAIN_EMBED_MODEL=${BRAIN_EMBED_MODEL:-bge-m3}
      # a sealed copy of every database a day in /data/backups, the last BRAIN_BACKUP_KEEP kept (default 7);
      # none without the key (32 random bytes, base64)
      - BRAIN_BACKUP_KEY=${BRAIN_BACKUP_KEY:-}
      - BRAIN_BACKUP_KEEP=${BRAIN_BACKUP_KEEP:-7}
      - BRAIN_DATA=/data
      - PORT=8080
      # the zone of the days of an account that has not chosen its own (the account page)
      - TZ=${BRAIN_TIMEZONE:-Europe/Rome}
    volumes:
      - brain-data:/data
    depends_on:
      ollama:
        condition: service_healthy
    # the proxy sends traffic only to a healthy container: checked every two seconds while it starts,
    # so a deploy is out of service for the seconds the new one takes to boot, not for half a minute
    healthcheck:
      test: [
        "CMD",
        "bash",
        "-c",
        "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && read -r l <&3 && [[ $$l == *' 200 '* ]]",
      ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # SIGTERM closes the databases (main.ts); past this, Docker kills
    stop_grace_period: 15s
    restart: unless-stopped
    # the log (one JSON line per request) is rotated by size, so it is never kept for long: the privacy
    # notice (public.ts) says so
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # the embedding model (bge-m3 by default), pulled once into its volume; bge-m3 is about 1.2 GB on
  # disk and 2 GB of memory while it works.
  ollama:
    image: ollama/ollama:0.35.0
    entrypoint: [
      "/bin/sh",
      "-c",
      "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$$BRAIN_EMBED_MODEL\"; wait",
    ]
    environment:
      # the model stays in memory (loading it costs seconds on a search); two requests at once
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=2
      - BRAIN_EMBED_MODEL=${BRAIN_EMBED_MODEL:-bge-m3}
    volumes:
      - brain-models:/root/.ollama
    # the model must not starve the brain of the CPU while it indexes
    cpus: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  brain-data:
  brain-models:
