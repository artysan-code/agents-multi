<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>claude-multi</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23a94a24'/><text x='16' y='22' font-size='16' font-family='monospace' font-weight='700' text-anchor='middle' fill='%23ffffff'>cm</text></svg>">
  </head>
  <body>
    <div class="app">
      <aside class="rail">
        <div class="brand">claude-multi</div>

        <nav id="nav" aria-label="Sections">
          <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span data-i18n="nav.today"></span></a>
          <a href="#tasks" data-v="tasks"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg><span data-i18n="nav.tasks"></span></a>
          <a href="#brain" data-v="brain"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8.3 7l7.4.7M7 8.3l2.2 7.4M16.6 10l-4.9 6"/></svg><span data-i18n="nav.brain"></span></a>
          <a href="#connections" data-v="connections"><svg viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v5a5 5 0 0 1-10 0z"/><path d="M12 17v4"/></svg><span data-i18n="nav.connections"></span></a>
          <a href="#system" data-v="system"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span data-i18n="nav.system"></span><span class="n" id="n-health"></span></a>
        </nav>

        <div class="rail-foot">
          <a class="state-line" id="state" href="#system/health"><i></i><span></span></a>
          <button class="kbd" id="pal-open"><svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span data-i18n="rail.search"></span><kbd>Ctrl K</kbd></button>
          <div class="prefs">
            <button class="kbd" id="theme-btn" data-i18n-title="rail.theme"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span id="theme-lbl">auto</span></button>
            <button class="kbd" id="lang-btn" data-i18n-title="rail.lang"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.5 2.5 13.5 0 16M12 4c-2.5 2.5-2.5 13.5 0 16"/></svg><span id="lang-lbl">auto</span></button>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="top">
          <div class="top-t">
            <span class="eyebrow" id="eyebrow"></span>
            <h1 id="title"></h1>
          </div>
          <div class="live" id="live"><span class="pulse"></span><span id="livetxt"></span></div>
        </header>

        <!-- ============ TODAY ============ -->
        <section class="view" id="v-today" hidden>
          <form class="hey-bar" id="hey-bar">
            <svg viewBox="0 0 24 24" class="ico"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <input name="text" data-i18n-ph="hey.ph" autocomplete="off">
            <kbd>Ctrl Space</kbd>
          </form>
          <div class="status-card" id="status" style="margin-top:16px"></div>
          <section class="panel" style="margin-top:16px">
            <div class="panel-h"><h3 data-i18n="tasks.title"></h3><span class="r" id="tk-sum"></span><a class="btn sm" href="#tasks" data-i18n="tasks.all"></a></div>
            <div id="tk-list"></div>
            <form class="tk-add" id="tk-add">
              <input name="title" class="search" data-i18n-ph="tasks.add.ph" required autocomplete="off">
              <input name="due" type="date" class="search" data-i18n-title="tasks.due">
              <input name="time" type="time" class="search" data-i18n-title="tasks.time">
              <input name="project" class="search" data-i18n-ph="tasks.project" autocomplete="off" style="max-width:130px">
              <button class="btn primary" type="submit" data-i18n="mk.add"></button>
            </form>
          </section>
          <div class="row c2">
            <section class="panel">
              <div class="panel-h"><h3 data-i18n="today.running"></h3><span class="r" id="run-n"></span></div>
              <div class="panel-b" id="running"></div>
            </section>
            <section class="panel">
              <div class="panel-h"><h3 data-i18n="today.resume"></h3><span class="r" data-i18n="today.resume.sub"></span></div>
              <div class="resume" id="resume"></div>
            </section>
          </div>
        </section>

        <!-- ============ TASKS ============ -->
        <section class="view wide" id="v-tasks" hidden>
          <div class="tb-bar">
            <div class="seg" id="tb-modes" role="group">
              <button data-mode="board" data-i18n="tb.board"></button>
              <button data-mode="list" data-i18n="tb.list"></button>
              <button data-mode="calendar" data-i18n="tb.calendar"></button>
              <button data-mode="projects" data-i18n="tb.projects"></button>
            </div>
            <input id="tb-q" class="search" type="search" data-i18n-ph="tb.search" autocomplete="off">
            <div class="seg" id="tb-owner" role="group">
              <button data-owner="all" data-i18n="tb.owner.all"></button>
              <button data-owner="me" data-i18n="tb.owner.me"></button>
              <button data-owner="claude" data-i18n="tb.owner.claude"></button>
              <button data-owner="others" data-i18n="tb.owner.others"></button>
            </div>
            <span class="r sub" id="tb-sum"></span>
            <button class="btn primary" id="tb-new" data-i18n="tb.new"></button>
          </div>
          <div class="tb-frame">
            <nav class="tb-folders" id="tb-folders" aria-label="Folders"></nav>
            <div class="tb-body" id="tb-body"></div>
          </div>
        </section>
        <!-- ============ BRAIN ============ -->
        <section class="view wide" id="v-brain" hidden>
          <div class="tb-bar">
            <div class="seg" id="bn-modes" role="group">
              <button data-bmode="read" data-i18n="brain.m.read"></button>
              <button data-bmode="graph" data-i18n="brain.m.graph"></button>
            </div>
            <input id="b-q" class="search" type="search" data-i18n-ph="brain.search" autocomplete="off">
            <span class="r sub" id="b-sum"></span>
            <button class="btn" id="b-add"></button>
          </div>
          <div class="bn-read" id="bn-read">
            <nav class="bn-tree" id="bn-tree" aria-label="Pages"></nav>
            <article class="panel bn-page" id="bn-page"></article>
            <aside class="bn-side">
              <section class="panel">
                <div class="panel-h"><h3 data-i18n="brain.near"></h3><label class="r sub bn-opt"><input type="checkbox" id="bn-d2"><span data-i18n="brain.depth2"></span></label></div>
                <canvas id="bn-local" class="bn-local" role="img" data-i18n-title="brain.graph"></canvas>
              </section>
              <section class="panel" id="bn-links"></section>
            </aside>
          </div>
          <div class="bn-graph panel" id="bn-graph" hidden>
            <div class="bn-gtools">
              <div class="bn-legend" id="bn-legend"></div>
              <label class="sub bn-opt"><input type="checkbox" id="bn-hubs"><span data-i18n="brain.hubs"></span></label>
              <button class="btn sm" id="bn-fit" data-i18n="brain.fit"></button>
            </div>
            <canvas id="bn-canvas" class="bn-canvas" role="img" data-i18n-title="brain.graph"></canvas>
            <div class="bn-card" id="bn-card" hidden></div>
            <p class="bn-help sub" data-i18n="brain.help"></p>
          </div>
        </section>
        <!-- ============ CONNECTIONS ============ -->
        <section class="view" id="v-connections" hidden>
          <p class="lede" data-i18n="conn.lede"></p>
          <div class="status-card" id="vault" style="margin-top:20px" hidden></div>
          <div class="status-card" id="gclient" style="margin-top:12px" hidden></div>
          <div class="panel" style="margin-top:20px">
            <div class="panel-h">
              <h3 data-i18n="acc.title"></h3>
              <span class="r" id="acc-sum"></span>
              <button class="btn primary" id="acc-add" data-i18n="acc.add"></button>
            </div>
            <div class="scroll">
              <table class="conn">
                <thead><tr><th data-i18n="acc.service"></th><th data-i18n="acc.name"></th><th data-i18n="acc.url"></th><th data-i18n="conn.profiles"></th><th data-i18n="acc.secret"></th><th></th></tr></thead>
                <tbody id="acc-rows"></tbody>
              </table>
            </div>
          </div>
          <div class="panel" style="margin-top:20px">
            <div class="panel-h">
              <h3 data-i18n="conn.servers"></h3>
              <span class="r"></span>
              <button class="btn" data-action="mcp-check" data-i18n="conn.check"></button>
              <button class="btn" data-action="mcp-sync" data-i18n="conn.sync"></button>
            </div>
            <div class="scroll">
              <table class="conn">
                <thead><tr><th data-i18n="conn.server"></th><th data-i18n="conn.profiles"></th><th data-i18n="conn.surfaces"></th><th data-i18n="conn.state"></th></tr></thead>
                <tbody id="conn-rows"></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ============ SYSTEM ============ -->
        <section class="view" id="v-system" hidden>
          <div class="tabs" role="tablist" id="tabs">
            <a href="#system/profiles" role="tab" data-t="profiles" data-i18n="sys.profiles"></a>
            <a href="#system/permissions" role="tab" data-t="permissions" data-i18n="sys.permissions"></a>
            <a href="#system/plugins" role="tab" data-t="plugins" data-i18n="sys.plugins"></a>
            <a href="#system/updates" role="tab" data-t="updates" data-i18n="sys.updates"></a>
            <a href="#system/health" role="tab" data-t="health" data-i18n="sys.health"></a>
          </div>

          <!-- profiles -->
          <div class="sub-view" id="s-profiles" role="tabpanel">
            <div class="panel">
              <div class="panel-h">
                <h3 data-i18n="sys.profiles"></h3>
                <span class="r" id="p-count"></span>
                <button class="btn primary" id="addp" data-i18n="profile.add"></button>
              </div>
              <div id="plist"></div>
            </div>
            <p class="note" data-i18n-html="profiles.note"></p>
          </div>

          <!-- permissions -->
          <div class="sub-view" id="s-permissions" role="tabpanel" hidden>
            <p class="lede" data-i18n="perm.lede"></p>
            <div class="perm-mode" style="margin-top:18px">
              <label class="fld" style="flex-direction:row;align-items:center;gap:10px"><span data-i18n="perm.mode"></span>
                <select id="perm-mode" class="sel" style="font-size:13px;padding:6px 8px">
                  <option value="default" data-i18n="perm.m.default"></option>
                  <option value="acceptEdits" data-i18n="perm.m.acceptEdits"></option>
                  <option value="plan" data-i18n="perm.m.plan"></option>
                  <option value="auto" data-i18n="perm.m.auto"></option>
                </select></label>
            </div>
            <div class="perm-lists" id="perm-lists"></div>
            <div id="perm-profiles"></div>
          </div>

          <!-- plugins & skills -->
          <div class="sub-view" id="s-plugins" role="tabpanel" hidden>
            <div class="panel">
              <div class="panel-h">
                <h3 data-i18n="pl.title"></h3>
                <span class="r" id="pl-sum"></span>
                <button class="btn" id="pl-refresh" data-i18n="pl.refresh"></button>
              </div>
              <div class="scroll">
                <table class="pl">
                  <thead><tr id="pl-head"></tr></thead>
                  <tbody id="pl-rows"><tr><td class="empty" data-i18n="pl.loading"></td></tr></tbody>
                </table>
              </div>
              <div class="panel-f" data-i18n-html="pl.foot"></div>
            </div>
            <div class="panel" style="margin-top:16px">
              <div class="panel-h">
                <h3 data-i18n="cat.title"></h3>
                <input id="cat-q" class="search" type="search" data-i18n-ph="cat.search" autocomplete="off">
                <select id="cat-mk" class="sel"></select>
                <span class="r" id="cat-sum"></span>
              </div>
              <div class="scroll">
                <table class="cat"><tbody id="cat-rows"><tr><td class="empty" data-i18n="cat.loading"></td></tr></tbody></table>
              </div>
            </div>
            <div class="row c2">
              <div class="panel">
                <div class="panel-h">
                  <h3 data-i18n="mk.title"></h3>
                  <span class="r"><code>extraKnownMarketplaces</code></span>
                  <button class="btn" id="mk-update" data-i18n="mk.updateAll"></button>
                </div>
                <div class="scroll"><table><tbody id="mk-rows"></tbody></table></div>
                <form class="panel-f mkadd" id="mk-add">
                  <input name="source" class="search" data-i18n-ph="mk.source.ph" required autocomplete="off">
                  <button class="btn" type="submit" data-i18n="mk.add"></button>
                </form>
              </div>
              <div class="panel">
                <div class="panel-h">
                  <h3 data-i18n="acct.title"></h3>
                  <span class="r" data-i18n="acct.readOnly"></span>
                </div>
                <div class="panel-b" id="acct"></div>
              </div>
            </div>
            <div class="panel" style="margin-top:16px">
              <div class="panel-h"><h3 data-i18n="shared.title"></h3></div>
              <div class="panel-b" id="shared"></div>
            </div>
          </div>

          <!-- updates -->
          <div class="sub-view" id="s-updates" role="tabpanel" hidden>
            <p class="lede" data-i18n="up.lede"></p>
            <div class="vcards" id="vcards" style="margin-top:20px"></div>
            <p class="note" id="embedded"></p>
            <div class="panel" style="margin-top:20px">
              <div class="panel-h">
                <h3 data-i18n="up.log"></h3>
                <span class="r"></span>
                <button class="btn" data-action="update-now" data-i18n="up.now"></button>
              </div>
              <div class="log" id="uplog"></div>
            </div>
          </div>

          <!-- health -->
          <div class="sub-view" id="s-health" role="tabpanel" hidden>
            <div class="panel">
              <div class="panel-h">
                <h3 data-i18n="health.checks"></h3>
                <span class="r" id="hsum"></span>
                <button class="btn" id="rerun" data-i18n="health.rerun"></button>
              </div>
              <div class="checks" id="checks"></div>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script src="/i18n.js"></script>
    <script src="/app.js"></script>
    <script src="/brain.js"></script>
    <script src="/tasks.js"></script>
  </body>
</html>
