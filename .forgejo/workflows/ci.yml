# CI on Forgejo Actions: the same gate as the pre-push hook (scripts/ci.sh).
#
# The job runs in the runner's default image for the `docker` label (node:22-bookworm), not in
# denoland/deno: actions/checkout is a JavaScript action and needs node inside the job container.
# Deno comes from setup-deno; the tools the gate requires in CI are pinned, sha256-checked
# gitleaks, jq and shellcheck releases (no apt-get: its index fetch alone cost more than the tools).
#
# Gated here: `dev`, the agents' branches (wf/*, agent/*: an agent pushes its branch and reads the verdict
# instead of running the whole gate on the owner's machine) and pull requests. `beta` and `release` move by
# fast-forward to commits `dev` already passed, and what is committed on `release` itself (the version bump,
# the update manifests) is gated by the release job of its tag. Gating the same commit on three branches
# tripled the runner's queue.
#
# The verdict is left on the commit as a git note (refs/notes/ci: "ci ok <run>" or "ci failed <run>"): `deno
# task ship` reads it with a plain fetch, no token, and ships only a commit CI passed.
name: ci
on:
  push:
    branches: [dev, "wf/**", "agent/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DENO_VERSION: v2.9.7
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  JQ_VERSION: "1.7.1"
  JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
  SHELLCHECK_VERSION: "0.10.0"
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  gate:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # the pinned tools, kept between runs: downloaded only when a version changes
      - name: tools cache
        id: tools
        uses: actions/cache@v4
        with:
          path: ~/ci-tools
          key: tools-${{ env.GITLEAKS_VERSION }}-${{ env.JQ_VERSION }}-${{ env.SHELLCHECK_VERSION }}

      - name: tools
        run: |
          if [[ -x ~/ci-tools/gitleaks && -x ~/ci-tools/jq && -x ~/ci-tools/shellcheck ]]; then
            install -m 755 ~/ci-tools/gitleaks ~/ci-tools/jq ~/ci-tools/shellcheck /usr/local/bin/
            corepack enable
            exit 0
          fi
          fetch() { # <url> <sha256> <file>
            curl -fsSL -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" /tmp/gitleaks.tgz &
          fetch "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64" \
            "$JQ_SHA256" /tmp/jq &
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "$SHELLCHECK_SHA256" /tmp/shellcheck.txz &
          for pid in $(jobs -p); do wait "$pid"; done # a failed download or checksum fails the step
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          install -m 755 /tmp/jq /usr/local/bin/jq
          tar -xJf /tmp/shellcheck.txz -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          mkdir -p ~/ci-tools && cp /usr/local/bin/gitleaks /usr/local/bin/jq /usr/local/bin/shellcheck ~/ci-tools/
          corepack enable

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
            apps/ui/node_modules
            apps/site/node_modules
            apps/site/.astro
          key: ci-${{ hashFiles('deno.lock', 'shared/mcp/*/deno.lock', 'apps/*/pnpm-lock.yaml') }}
          restore-keys: ci-

      - name: gate
        run: bash scripts/ci.sh

      # the verdict on the commit, for `deno task ship` (a cancelled run leaves none)
      - name: verdict
        if: ${{ always() && github.event_name == 'push' && (job.status == 'success' || job.status == 'failure') }}
        env:
          VERDICT: ${{ job.status == 'success' && 'ok' || 'failed' }}
        run: |
          git config user.name "Agents Multi CI"
          git config user.email "ci@agents-multi.invalid"
          for _ in 1 2 3; do
            git fetch -q origin "+refs/notes/ci:refs/notes/ci" 2>/dev/null || true
            git notes --ref=ci add -f -m "ci $VERDICT $GITHUB_RUN_NUMBER" "$GITHUB_SHA"
            git push -q origin refs/notes/ci && exit 0
          done
          echo "::warning::the verdict could not be written on the commit"
