# CI on Forgejo Actions: the same gate as the pre-push hook (scripts/ci.sh).
#
# The job runs in the runner's default image for the `docker` label (node:22-bookworm), not in
# denoland/deno: actions/checkout is a JavaScript action and needs node inside the job container.
# Deno comes from setup-deno; the linters the gate requires in CI come from apt and from a pinned,
# checksummed gitleaks, jq and shellcheck releases (no apt-get: its index fetch alone cost more than the tools).
#
# Only `dev` is gated here: `beta` and `release` move by fast-forward to commits `dev` already passed,
# and what is committed on `release` itself (the version bump, the update manifests) is gated by the
# release job of its tag. Gating the same commit on three branches tripled the runner's queue.
name: ci
on:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DENO_VERSION: v2.9.7
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  JQ_VERSION: "1.7.1"
  JQ_SHA256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
  SHELLCHECK_VERSION: "0.10.0"
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  gate:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: tools
        run: |
          fetch() { # <url> <sha256> <file>
            curl -fsSL -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" /tmp/gitleaks.tgz &
          fetch "https://github.com/jqlang/jq/releases/download/jq-${JQ_VERSION}/jq-linux-amd64" \
            "$JQ_SHA256" /tmp/jq &
          fetch "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            "$SHELLCHECK_SHA256" /tmp/shellcheck.txz &
          for pid in $(jobs -p); do wait "$pid"; done # a failed download or checksum fails the step
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          install -m 755 /tmp/jq /usr/local/bin/jq
          tar -xJf /tmp/shellcheck.txz -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          corepack enable

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
          key: ci-${{ hashFiles('deno.lock', 'shared/mcp/*/deno.lock', 'apps/*/pnpm-lock.yaml') }}
          restore-keys: ci-

      - name: gate
        run: bash scripts/ci.sh
