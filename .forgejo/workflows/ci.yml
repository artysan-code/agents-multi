# CI di claude-multi su Forgejo Actions: type-check, sintassi bash, test, guard segreti.
# Runner: "ark-docker" (label docker) su ark, dentro Coolify → risorsa «Forgejo Runner».
#
# Il job gira nell'immagine di default della label, node:22-bookworm, e NON in denoland/deno:
# actions/checkout è una action JavaScript e ha bisogno di `node` dentro il container del job,
# che l'immagine di Deno non ha (il primo run è fallito esattamente lì). Deno lo installa setup-deno.
name: ci
on:
  push:
    branches: [release]
  pull_request:

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: check (type-check CLI + bash -n script)
        run: deno task check
      - name: test
        run: deno task test
      - name: site (Astro build)
        working-directory: site
        run: corepack enable && pnpm install --frozen-lockfile && pnpm build
      - name: guard segreti sull'intero albero
        run: |
          ! git grep -nE 'sk-ant-[A-Za-z0-9_-]{10,}|"(accessToken|refreshToken|oauthAccount)"\s*:' -- ':!cli/tests' ':!.githooks' ':!.forgejo'
