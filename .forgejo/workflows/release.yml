# Releases on Forgejo, on every version tag (vX.Y.Z, vX.Y.Z-beta.N, vX.Y.Z-rc.N): docs/adr/0002, docs/adr/0004.
#
# `publish`: a Forgejo release for each tag that has none yet, with its CHANGELOG section as the notes
# (scripts/publish-releases.ts). The job's own token is enough.
#
# `brain-image`: the brain's image on GHCR, after `app` (below).
#
# `app`: the desktop app. The static gate, then the Linux bundles (deb, rpm, AppImage) signed for the updater,
# uploaded to the GitHub release of the tag, then the site's update manifests moved to the version and
# committed on `release`; the site that serves them is in the brain's image (`brain-image`). A stable
# version also renders the AUR package there, and pushes it when the AUR key is set.
#
# The runner's image (node:22-bookworm) has neither Rust nor WebKitGTK: this job installs them, the
# toolchain pinned below; Deno is pinned like bundle.sh's DENO_VERSION, which refuses any other.
#
# Secrets (Forgejo › repository › Settings › Actions › Secrets), held by the owner:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   the updater's signing key
#   GH_RELEASE_TOKEN    a GitHub token with Contents: read and write on the repository in release.json
#   AUR_SSH_PRIVATE_KEY the AUR account's SSH key; without it the AUR files are committed, not pushed
name: release
on:
  push:
    tags: ["v*"]

env:
  DENO_VERSION: v2.9.7

jobs:
  publish:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every tag, for the ones without a release yet

      - uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: publish
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          FORGEJO_REPO: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deno run --allow-read --allow-env --allow-net --allow-run=git scripts/publish-releases.ts

  # the heavy lane (atlas-heavy): two at a time, never queued behind the light lane's jobs of every repository
  app:
    runs-on: heavy
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # one release at a time writes the update manifests on `release`
    concurrency:
      group: app-release
      cancel-in-progress: false
    env:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      RUST_VERSION: "1.99.0"
      # linuxdeploy (the AppImage) is itself an AppImage: no FUSE in a container
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the manifests' commit is made on `release` and pushed

      - uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: the version is the tag's
        run: |
          # Deno: the image has no jq
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("apps/desktop/package.json")).version)')"
          [[ "v$version" == "$GITHUB_REF_NAME" ]] || { echo "the tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }
          echo "VERSION=$version" >>"$GITHUB_ENV"
          deno run --allow-read scripts/app-release.ts check

      # libayatana-appindicator3-dev: the app's Linux tray is ksni, but the bundler reads the
      # `tray-icon` feature in Cargo.toml without its target and refuses an AppImage when no
      # appindicator library is installed; zstd: actions/cache compresses with it when it is
      # there, and gzip took about 5 minutes over the 1.4 GB of Cargo's build at the end of every job
      # apt's lists and packages and the Rust toolchain, kept between releases: apt and rustup took about a
      # minute of each release, fetching the same things
      - name: tools cache
        uses: actions/cache@v4
        with:
          path: |
            ~/apt-cache
            ~/.rustup
            ~/.cargo/bin
          key: tools-${{ env.RUST_VERSION }}-${{ hashFiles('.forgejo/workflows/release.yml') }}
          restore-keys: tools-${{ env.RUST_VERSION }}-

      - name: tools
        run: |
          # the image deletes what apt downloads (docker-clean): kept in the cached folder instead
          rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/apt-cache/archives/partial ~/apt-cache/lists/partial
          apt="-o Dir::Cache::Archives=$HOME/apt-cache/archives -o Dir::State::Lists=$HOME/apt-cache/lists"
          # shellcheck disable=SC2086
          apt-get $apt update -qq
          # shellcheck disable=SC2086
          apt-get $apt install -y -qq --no-install-recommends file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libxdo-dev \
            libayatana-appindicator3-dev zstd >/dev/null
          if ! "$HOME/.cargo/bin/rustc" --version 2>/dev/null | grep -q " $RUST_VERSION "; then
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal \
              --default-toolchain "$RUST_VERSION" --component rustfmt,clippy
          fi
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          corepack enable

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
            ~/.cargo/registry
            apps/desktop/src-tauri/target
            !apps/desktop/src-tauri/target/release/bundle
          key: app-${{ hashFiles('deno.lock', 'shared/mcp/*/deno.lock', 'apps/*/pnpm-lock.yaml', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: app-

      # The Rust's fmt and clippy only: this job alone has WebKitGTK. Everything else in the gate (formatting,
      # lint, types, shellcheck, tests, the MCP probe, the secret scan, the UI and site builds) already passed
      # on these commits: in CI on `dev`, and in `deno task ship` before the tag; the release commit on top
      # changes only the manifests and the CHANGELOG.
      - name: check
        run: bash scripts/check.sh --desktop

      - name: build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # a cache saved before it left the bundles out brings an older version's: prepare refuses two
          rm -rf apps/desktop/src-tauri/target/release/bundle
          deno eval 'import { uiCommand } from "./apps/cli/ui.ts"; Deno.exit(await uiCommand(["build"]));'
          cd apps/desktop
          pnpm install --frozen-lockfile
          pnpm release
          cd ../..
          deno run --allow-read --allow-write scripts/app-release.ts prepare \
            apps/desktop/src-tauri/target/release/bundle dist-app

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: deno run --allow-read --allow-env --allow-net=api.github.com,uploads.github.com scripts/app-release.ts publish dist-app

      - name: update channels
        run: |
          git config user.name "Agents Multi release"
          git config user.email "release@agents-multi.invalid"
          # the tag's scripts, not those on `release`: that branch moves at stable versions only, and its
          # copy may not know this version's form (a release candidate)
          tag_scripts=$(mktemp -d)
          cp -r scripts/. "$tag_scripts"
          for _ in 1 2 3; do
            git fetch --quiet origin release
            git checkout --quiet -B release origin/release
            deno run --allow-read --allow-write "$tag_scripts/app-release.ts" channels dist-app/latest.json
            if [[ "$VERSION" != *-beta.* && "$VERSION" != *-rc.* ]]; then
              if [[ -n "$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("apps/desktop/release.json")).license ?? "")')" ]]; then
                deno run --allow-read --allow-write "$tag_scripts/aur.ts" render "$VERSION" \
                  "$(sha256sum "dist-app/agents-multi_${VERSION}_amd64.deb" | cut -d' ' -f1)"
              else
                echo "::warning::release.json has no licence: the AUR package is not rendered"
              fi
            fi
            git add apps/site/public/updates
            if [[ -d pkg/agents-multi-bin ]]; then git add pkg/agents-multi-bin; fi
            if git diff --cached --quiet; then exit 0; fi
            git commit --quiet -m "chore(updates): v$VERSION on its update channels"
            git push --quiet origin release && exit 0
            git reset --quiet --hard origin/release # someone pushed meanwhile: again on top
          done
          exit 1

      - name: AUR
        if: ${{ !contains(github.ref_name, '-beta.') && !contains(github.ref_name, '-rc.') }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [[ -f pkg/agents-multi-bin/PKGBUILD ]] || { echo "no AUR package rendered"; exit 0; }
          [[ -n "$AUR_SSH_PRIVATE_KEY" ]] || { echo "no AUR key: the package is committed, not pushed"; exit 0; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes" \
            deno run --allow-read --allow-write --allow-run=git --allow-env scripts/aur.ts push pkg/agents-multi-bin

  # The brain's image on GHCR, built by kaniko: the runner gives jobs no Docker socket and no
  # privileges, and kaniko needs neither. It builds from git (the job token reads the repository), from the
  # tagged commit, at the same time as the app (it needs nothing of it):
  #   - a stable version → :latest, which the production brain runs, and :X.Y.Z and :X.Y;
  #   - a beta or an rc → :beta and :X.Y.Z-beta.N (the beta's code); :latest is left alone.
  # Then brain-deploy has Coolify pull again the resources on the tag that moved: Coolify's deploy
  # endpoint (`/api/v1/deploy?uuid=<a>,<b>`, apps/brain/coolify/) in COOLIFY_DEPLOY_URL for those on
  # :latest (the brain), redeployed by a stable version, and in COOLIFY_DEPLOY_BETA_URL for those on
  # :beta (the site, until 1.0.0), by a beta. The site reads the update manifests from `release` on
  # its own (apps/brain/manifests.ts): no resource is redeployed for them.
  # Without GHCR_TOKEN (a GitHub token with write:packages on artysan-code) nothing is built; without
  # the URL and COOLIFY_TOKEN nothing is redeployed. Kaniko keeps its layers in :<image>-cache.
  brain-image:
    runs-on: docker
    timeout-minutes: 40
    container:
      image: ghcr.io/osscontainertools/kaniko:v1.28.5-debug@sha256:d6d74217dc077acfd3094992e917c357080a2d3fdd1042a49e34e29a7e57c572
    outputs:
      built: ${{ steps.build.outputs.built }}
    env:
      IMAGE: ghcr.io/artysan-code/agents-multi-brain
      SOURCE: https://github.com/artysan-code/agents-multi
    steps:
      - name: build and push
        id: build
        env:
          GIT_USERNAME: oauth2
          GIT_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          [ -n "$GHCR_TOKEN" ] || { echo "no GHCR_TOKEN: the brain's image is not built"; exit 0; }
          mkdir -p /kaniko/.docker
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$(printf 'x:%s' "$GHCR_TOKEN" | base64 -w0)" \
            >/kaniko/.docker/config.json
          version="${GITHUB_REF_NAME#v}"
          repo="git://git.artysan.me/${GITHUB_REPOSITORY}.git"
          build() { # <ref> <commit> <tag>...
            ctx="$repo#$1#$2"; shift 2
            dest=""; for t in "$@"; do dest="$dest --destination $IMAGE:$t"; done
            # --cache: the dependency layers come back from the registry when their inputs did not change
            /kaniko/executor --context "$ctx" --dockerfile apps/brain/Dockerfile $dest --cleanup \
              --cache=true --cache-repo "$IMAGE-cache" --cache-ttl=336h \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.version=$version" --verbosity warn
          }
          # from the tagged commit, on the branch that holds it (the tag is annotated, the commit is not);
          # a beta or an rc no longer rebuilds :latest, the production brain: the manifests it would carry
          # are read live from `release`
          case "$version" in
            *-beta.*|*-rc.*) build refs/heads/beta "$GITHUB_SHA" beta "$version" ;;
            *) build refs/heads/release "$GITHUB_SHA" latest "$version" "${version%.*}" ;;
          esac
          echo "built=true" >>"$GITHUB_OUTPUT"

  # Coolify pulls the moved tag again. Its own job: busybox's wget in kaniko's image does not check TLS
  # certificates, and the request carries a token.
  brain-deploy:
    needs: brain-image
    if: ${{ needs.brain-image.outputs.built == 'true' }}
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: redeploy
        env:
          STABLE_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          BETA_URL: ${{ secrets.COOLIFY_DEPLOY_BETA_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in *-beta.*|*-rc.*) url="$BETA_URL" ;; *) url="$STABLE_URL" ;; esac
          [ -n "$url" ] && [ -n "$COOLIFY_TOKEN" ] ||
            { echo "no Coolify deploy hook for this channel: nothing redeployed"; exit 0; }
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$url"
