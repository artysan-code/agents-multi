# The brain on Coolify: the service, and the embedding model next to it on a private network. This
# is the first instance, the one that also runs Ollama; every other person's brain is
# compose.instance.yaml and uses this Ollama (one model in memory, not one per person).
# Coolify builds this from the repository (base directory /brain, compose file /compose.yaml: the
# build context is the repository root) and puts the domain in front of `brain`: SERVICE_URL_BRAIN_8080
# tells its proxy the port, and SERVICE_URL_BRAIN is that domain. The secrets are set in Coolify,
# never here.
services:
  brain:
    build:
      context: ..
      dockerfile: brain/Dockerfile
    environment:
      - SERVICE_URL_BRAIN_8080
      - BRAIN_URL=${SERVICE_URL_BRAIN}
      - BRAIN_PASSPHRASE=${BRAIN_PASSPHRASE}
      - BRAIN_TOTP_SECRET=${BRAIN_TOTP_SECRET}
      - BRAIN_BACKUP_KEY=${BRAIN_BACKUP_KEY}
      # whose brain this is (shared/mcp/lib/owner.ts): the default owner of a task, the name and language
      - CLAUDE_MULTI_OWNER_ID=${CLAUDE_MULTI_OWNER_ID}
      - CLAUDE_MULTI_OWNER_NAME=${CLAUDE_MULTI_OWNER_NAME}
      - CLAUDE_MULTI_LANGUAGE=${CLAUDE_MULTI_LANGUAGE}
      - BRAIN_EMBED_URL=${BRAIN_EMBED_URL:-http://ollama:11434}
      - BRAIN_EMBED_MODEL=bge-m3
      - BRAIN_DATA=/data
      - PORT=8080
      - TZ=Europe/Rome
    volumes:
      - brain-data:/data
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:8080/health'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # bge-m3, pulled once into its volume; about 1.2 GB on disk and 2 GB of memory while it works.
  # The other instances reach it over Coolify's shared network ("Connect to Predefined Network" on
  # both applications) as ollama-<this application's uuid>:11434.
  ollama:
    image: ollama/ollama:0.35.0
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull bge-m3; wait"]
    environment:
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - brain-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  brain-data:
  brain-models:
