# Another person's brain on Coolify: the same service, its own domain, volume and secrets, and the
# embedding model of the first instance (compose.yaml) instead of an Ollama of its own. On Coolify:
# a Docker Compose application from this repository, base directory /brain, compose file
# /compose.instance.yaml, "Connect to Predefined Network" on (and on the first instance too), and
# these variables: the secrets (BRAIN_PASSPHRASE, BRAIN_TOTP_SECRET, BRAIN_BACKUP_KEY), whose brain it
# is (CLAUDE_MULTI_OWNER_ID, CLAUDE_MULTI_OWNER_NAME, CLAUDE_MULTI_LANGUAGE) and where the model is
# (BRAIN_EMBED_URL, http://ollama-<first instance's uuid>:11434). Watch paths as the first instance.
services:
  brain:
    build:
      context: ..
      dockerfile: brain/Dockerfile
    environment:
      - SERVICE_URL_BRAIN_8080
      - BRAIN_URL=${SERVICE_URL_BRAIN}
      - BRAIN_PASSPHRASE=${BRAIN_PASSPHRASE}
      - BRAIN_TOTP_SECRET=${BRAIN_TOTP_SECRET}
      - BRAIN_BACKUP_KEY=${BRAIN_BACKUP_KEY}
      - CLAUDE_MULTI_OWNER_ID=${CLAUDE_MULTI_OWNER_ID}
      - CLAUDE_MULTI_OWNER_NAME=${CLAUDE_MULTI_OWNER_NAME}
      - CLAUDE_MULTI_LANGUAGE=${CLAUDE_MULTI_LANGUAGE}
      - BRAIN_EMBED_URL=${BRAIN_EMBED_URL}
      - BRAIN_EMBED_MODEL=bge-m3
      - BRAIN_DATA=/data
      - PORT=8080
      - TZ=${TZ:-Europe/Rome}
    volumes:
      - brain-data:/data
    healthcheck:
      test: ["CMD", "deno", "eval", "const r = await fetch('http://127.0.0.1:8080/health'); if (!r.ok) Deno.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  brain-data:
