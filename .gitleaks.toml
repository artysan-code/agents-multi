# gitleaks (v8.30) configuration: the default rules, Claude Code's credential fields, and the
# public values that look like keys. Run by scripts/ci.sh: `gitleaks git --config .gitleaks.toml .`
[extend]
useDefault = true

# A Claude Code credentials file or .claude.json committed by mistake.
[[rules]]
id = "claude-credentials"
description = "Claude Code OAuth credentials or account record"
regex = '''"(accessToken|refreshToken|oauthAccount)"\s*:'''
keywords = ["accesstoken", "refreshtoken", "oauthaccount"]

[[rules.allowlists]]
description = "tests and the guards that look for these fields"
paths = ['''^apps/cli/tests/''', '''^apps/brain/tests/''', '''^\.githooks/''', '''^shared/hooks/''',
  # where the tests lived before apps/ (the scan covers the history)
  '''^cli/tests/''', '''^brain/tests/''']

[allowlist]
description = "public values that look like keys"
# made-up tokens of every shape the masking recognises, which its test feeds it, and the made-up
# credential coolify's guard must refuse in a deploy command
paths = ['''^apps/cli/tests/mask_test\.ts$''', '''^apps/cli/tests/coolify_test\.ts$''']
regexes = [
  # fingerprint of Anthropic's apt signing key, pinned in bin/claude-desktop-update
  '''31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE''',
  # RFC 6238 test vector secret, apps/brain/tests/brain_test.ts
  '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''',
  # RFC 8291 appendix A test vector keys, apps/brain/tests/push_test.ts
  '''yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw''',
  '''BTBZMqHH6r4Tts7J_aSIgg''',
  # the made-up key fingerprint that shows the format, docs/adr/0013
  '''ab12-cd34-ef56-7890''',
]
